# QUICK tier on every push and PR. ~10-15 min.
#
# A plain checkout is all this needs; build.zig.zon declares no dependencies since
# 2026-09-16 (the Earley parser went with the bootstrap). Until 2026-08-05 the Earley
# dependency was `.path = "../earley"` -- a sibling directory not in the repo -- and
# these workflows carried a second checkout step to fake that layout.
name: gates (quick)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless. Cancel it rather than pay for both.
concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LINUX (added 2026-09-26, Sean's go-ahead). The note on the Windows job below said a
  # Linux run would be "an untested configuration reporting on an untested
  # configuration" -- true when it was written, and no longer: every release ships a
  # Linux build, and the two platform bugs of 2026-09-26 were BOTH found on Linux by
  # accident (BUG-450, `use` resolving case-insensitively on Windows only; the GTK
  # Scintilla startup crash). This job is the place those are meant to be found instead.
  # Separate from the Windows job so a red here names its platform.
  quick-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache Zig
        id: cache-zig-linux
        uses: actions/cache@v4
        with:
          path: zig-toolchain
          key: zig-0.17.0-x86_64-linux

      - name: Download Zig 0.17.0 (checksum-pinned, as in release.yml)
        if: steps.cache-zig-linux.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          want=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          curl -fsSL "$url" -o zig.tar.xz
          got=$(sha256sum zig.tar.xz | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "::error::Zig checksum mismatch: got $got want $want"; exit 1; }
          tar xf zig.tar.xz
          mv zig-x86_64-linux-0.17.0 zig-toolchain

      - name: Put Zig on PATH and prove it runs
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/zig-toolchain" >> "$GITHUB_PATH"
          v="$("$GITHUB_WORKSPACE/zig-toolchain/zig" version)"
          echo "zig version: $v"
          [ "$v" = "0.17.0" ] || { echo "::error::expected zig 0.17.0, got '$v'"; exit 1; }

      - name: Build
        run: zig build

      - name: Doctor (tree trustworthy?)
        run: bash tools/doctor.sh

      - name: Gates (QUICK tier)
        env:
          GATES_LOG_DIR: ${{ github.workspace }}/gate-logs
          CLI_CHECK_TMO: "300"
        run: bash tools/gates.sh

      - name: Keep failing gates' full output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gate-logs-${{ github.job }}-${{ github.run_id }}
          path: gate-logs/
          if-no-files-found: ignore

  quick:
    # Windows was the only tested platform until 2026-09-26 (see quick-linux above).
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # fetch-depth 0 + fetch-tags: the divergence gate compares against the N-1 anchor,
      # which tools/n1_reference.sh locates by the newest `n1-anchor-*` TAG and builds
      # from that COMMIT. A shallow, tagless checkout (the v4 default) has neither, so
      # the gate refused on every run since divergence was re-pointed (2026-09-01):
      # "REFUSING -- no n1-anchor-* tag exists". Found on the 2026-09-12 full run.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # Zig is downloaded directly rather than via a third-party action, and
      # pinned by CHECKSUM as well as version. The URL and shasum were taken
      # from ziglang.org/download/index.json, not guessed -- the filename format
      # is `zig-x86_64-windows-0.17.0.zip`, which is NOT the older
      # `zig-windows-x86_64-...` pattern that instinct suggests.
      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: zig-toolchain
          key: zig-0.17.0-x86_64-windows

      - name: Download Zig 0.17.0
        if: steps.cache-zig.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url=https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
          want=b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
          curl -fsSL "$url" -o zig.zip
          got=$(sha256sum zig.zip | cut -d' ' -f1)
          # A checksum mismatch must STOP the job, not warn. A silently-wrong
          # toolchain would make every gate below measure the wrong compiler,
          # which is worse than no CI at all.
          [ "$got" = "$want" ] || { echo "::error::Zig checksum mismatch: got $got want $want"; exit 1; }
          unzip -q zig.zip
          mv zig-x86_64-windows-0.17.0 zig-toolchain

      - name: Put Zig on PATH and prove it runs
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/zig-toolchain" >> "$GITHUB_PATH"
          # Liveness, not presence: a binary that cannot start prints nothing and
          # exits 0 in some failure modes. Make it say its version, and check it.
          v="$("$GITHUB_WORKSPACE/zig-toolchain/zig.exe" version)"
          echo "zig version: $v"
          [ "$v" = "0.17.0" ] || { echo "::error::expected zig 0.17.0, got '$v'"; exit 1; }

      - name: Python version (gates call bare `python`)
        shell: bash
        run: python --version

      - name: Build
        shell: bash
        run: zig build

      # gates.sh runs tools/doctor.sh as a preflight and REFUSES to report on an
      # untrustworthy tree, so this is not merely informational -- if it exits 1,
      # the gate results below would have been lies.
      - name: Doctor (tree trustworthy?)
        shell: bash
        run: bash tools/doctor.sh

      - name: Gates (QUICK tier)
        shell: bash
        env:
          GATES_LOG_DIR: ${{ github.workspace }}/gate-logs
          CLI_CHECK_TMO: "300"   # cold runner: the BUG-324 leg LLVM fallback exceeded 90 s (2026-09-12)
        run: bash tools/gates.sh

      # The evidence a red gate leaves behind. Without this the runner discards it and the
      # board's 12-line tail is all anyone gets (2026-09-12: a truncated regression list
      # read as an alphabetical pattern). `if: failure()` -- nothing to keep on green.
      - name: Keep failing gates' full output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gate-logs-${{ github.job }}-${{ github.run_id }}
          path: gate-logs/
          if-no-files-found: ignore

      # gates.sh already asserts that every registered gate RAN (it counts its own
      # `run` lines), so a silently-skipped gate fails the step above rather than
      # passing quietly. Nothing further is needed here.
